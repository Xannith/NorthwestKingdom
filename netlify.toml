# Netlify deployment configuration for northwestkingdom.com
# Plain static site — no build step required.

[build]
  publish = "."
  command = ""
  # Netlify Forms "submission-created" event handler lives here (invoice emails).
  functions = "functions"

[functions]
  node_bundler = "esbuild"

# Security and performance headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Cache headers ──────────────────────────────────────────────────────────────
# IMPORTANT: rule ORDER matters. Netlify applies the LAST matching [[headers]]
# rule's Cache-Control, so the broad "/assets/*" rule MUST come first and the
# more specific rules must follow — otherwise "/assets/*" clobbers them and JS
# gets cached for a year (users run stale code until they clear their cache).
# Do NOT use "immutable" for any file whose content may change between deploys
# without a filename change.

# Images and other static assets — cache aggressively (filenames don't change).
# Broad fallback; more specific rules below override it for their paths.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# CSS — medium cache (changes less often; 1 hour is safe without content hashing)
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# JavaScript — always revalidate so updates take effect on next page load
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vendor JS (minified, stable — ok to cache longer but not immutable).
# After /assets/js/* so it wins for vendor files.
[[headers]]
  for = "/assets/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Nav component HTML — always revalidate (nav changes when we update them)
[[headers]]
  for = "/assets/components/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML pages — never cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Data files
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Identity-protected routes ─────────────────────────────────────────────────
# Rules are evaluated in order. The first matching rule wins.
# Netlify Identity must be enabled in the dashboard for these to take effect.

# Calendar moved to the public area. These exact-path rules must come BEFORE the
# /member/* gating below so the old member-calendar URL reaches the public page
# without a login. Only the calendar index moves; other /member/calendar/* pages
# stay gated by the rules further down.
[[redirects]]
  from = "/member/calendar/"
  to   = "/public/calendar/"
  status = 301
  force = true

[[redirects]]
  from = "/member/calendar/index.html"
  to   = "/public/calendar/"
  status = 301
  force = true

# Member area: members and admins may enter; everyone else goes to login.
[[redirects]]
  from = "/member/*"
  to   = "/member/:splat"
  status = 200
  conditions = {Role = ["member", "admin"]}

[[redirects]]
  from = "/member/*"
  to   = "/login/?redirect=/member/:splat"
  status = 302
  force = true

# Admin area: admins only; everyone else goes to login.
[[redirects]]
  from = "/admin/*"
  to   = "/admin/:splat"
  status = 200
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/admin/*"
  to   = "/login/?redirect=/admin/:splat"
  status = 302
  force = true

# ── Friendly 404 ──────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 404
  force = false
